name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project zip
        run: |
          ZIP=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No zip found - building the repo as is"
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Extracting $ZIP"
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q -o "$ZIP" -d "$RUNNER_TEMP/src"
          POM=$(find "$RUNNER_TEMP/src" -name pom.xml -not -path '*/__MACOSX/*' | head -n 1)
          if [ -z "$POM" ]; then
            echo "No pom.xml inside the zip" >&2
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$POM")" >> "$GITHUB_ENV"

      - name: Build jar
        working-directory: ${{ env.PROJECT_DIR }}
        run: mvn -B -q package

      - name: Collect jar
        run: |
          mkdir -p out
          cp "$PROJECT_DIR"/target/CaneIslands.jar out/CaneIslands.jar

      - uses: actions/upload-artifact@v4
        with:
          name: CaneIslands
          path: out/CaneIslands.jar
